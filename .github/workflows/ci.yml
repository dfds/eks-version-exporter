name: CI

on:
  push:
    branches:
      - master
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - dummy.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: eu-central-1
      IMAGE_NAME: eks-version-exporter
      ECR_REPOSITORY: ded/eks-version-exporter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_NAME" -f Dockerfile .
          docker tag "$IMAGE_NAME:latest" "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update Flux deployment image tag
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_RUN_NUMBER}|" k8s/deployment.yaml
          echo "Updated k8s image tag to ${GITHUB_RUN_NUMBER}"

      - name: Commit Flux deployment update to current branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(ci): update flux deployment image [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
