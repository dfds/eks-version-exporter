apiVersion: v1
kind: Service
metadata:
  name: {{ include "eks-version-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eks-version-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.name }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- with .Values.service.protocol }}
      protocol: {{ . | quote }}
      {{- end }}
  selector:
    {{- include "eks-version-exporter.selectorLabels" . | nindent 4 }}
