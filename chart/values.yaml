replicaCount: 1

image:
  repository: 579478677147.dkr.ecr.eu-central-1.amazonaws.com/ded/eks-version-exporter
  pullPolicy: IfNotPresent
  tag: "4"

nameOverride: ""
fullnameOverride: ""
namespace: ""

labels:
  project: selfservice
  department: cloudengineering
  component: eks-version-exporter

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  name: metrics
  port: 8080
  targetPort: metrics
  protocol: ""

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 3600s # we don't need the resolution more often than daily, so could go higher
  namespaceSelector:
    matchNames: []
  metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: "eks_version_exporter|eks_version_exporter_is_outdated|eks_version_exporter_is_past_eol"

resources: {}

priorityClassName: ""

nodeSelector: {}

tolerations: []

affinity: {}
